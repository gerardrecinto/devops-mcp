# devops-mcp speaks MCP over stdio, so it is started by the client, not left running.
#   docker compose run -i --rm devops-mcp
services:
  devops-mcp:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - KUBECONFIG=/home/devops-mcp/.kube/config
    volumes:
      - ${HOME}/.kube:/home/devops-mcp/.kube:ro
      - ${HOME}/.devops-mcp:/home/devops-mcp/.devops-mcp
    stdin_open: true
